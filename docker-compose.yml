services:
  showcase:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mohamed-showcase
    restart: unless-stopped
    ports:
      - "3080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    networks:
      - showcase_net

networks:
  showcase_net:
    driver: bridge
