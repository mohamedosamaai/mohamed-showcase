name: Publish Package & SLSA Provenance

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  packages: write

jobs:
  publish:
    name: Build, Attest & Publish Package Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
          scope: '@mohamedosamaai'

      - name: Install dependencies
        run: npm install

      - name: Verify TypeScript & Build
        run: |
          npm run lint
          npm run build

      - name: Run Unit Tests
        run: npm test

      - name: Publish Package Suite to GitHub Packages
        run: |
          # 1. Publish Primary Package
          npm publish --access public || true

          # 2. Publish Core Contracts Package
          node -e "const p = require('./package.json'); p.name = '@mohamedosamaai/mohamed-core'; require('fs').writeFileSync('./package.json', JSON.stringify(p, null, 2));"
          npm publish --access public || true

          # 3. Publish Mock Simulation Package
          node -e "const p = require('./package.json'); p.name = '@mohamedosamaai/mohamed-mock'; require('fs').writeFileSync('./package.json', JSON.stringify(p, null, 2));"
          npm publish --access public || true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Distribution Tarball
        id: package
        run: |
          tar -czf ../mohamed-showcase-dist.tar.gz --exclude='./.git' --exclude='./node_modules' .
          mv ../mohamed-showcase-dist.tar.gz ./mohamed-showcase-dist.tar.gz
          echo "artifact_path=mohamed-showcase-dist.tar.gz" >> $GITHUB_OUTPUT

      - name: Attest Build Provenance (SLSA Level 3 Sigstore)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.package.outputs.artifact_path }}

      - name: Upload Attested Distribution Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mohamed-showcase-dist
          path: mohamed-showcase-dist.tar.gz
          retention-days: 90
